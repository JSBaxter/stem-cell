_min_copier_version: "9.0.0"
_subdirectory: template

_envops:
  trim_blocks: true
  lstrip_blocks: true
  keep_trailing_newline: true

# Cell-owned after birth (spec "Owned files"): copier renders these once and
# never overwrites them on `copier update`. A change to their shape in the
# template is described in CHANGES.md (quoted into the sync PR body), not
# applied.
_skip_if_exists:
  - thresholds.yml
  - CLAUDE.md
  - README.md
  - .gitignore
  - specs/**
  - docs/adr/**

_message_after_copy: |
  Cell rendered.

  Inside the new cell:

    git init && git add -A && git commit -m "chore(repo): initial cell from stem-cell"

  Create the GitHub repository and push. Then run the harness initialisation
  from a local session (harness specs/project-creation.md; it needs repo
  settings and secrets that a cloud session cannot write). It applies the
  branch ruleset and the OAuth secret, creates every state:, route:, source:
  and priority: label through cellq, and opens the first issue, "write the
  first spec", via `cellq idea`.

  A cell that chooses a language runs the harness setup skill for it (for
  example python-setup) as its first task.

_message_after_update: |
  Cell synced from stem-cell.

  The sync touched template-owned files only. Cell-owned files
  (thresholds.yml, CLAUDE.md, README.md, .gitignore, specs/, docs/adr/)
  were skipped. Read the "## Shape notes" section of the sync PR, or
  CHANGES.md in stem-cell, for template changes to owned files and apply
  them by hand if they matter to this cell.

# ---------------------------------------------------------------------------
# Questions. Exactly these four; no other.
# ---------------------------------------------------------------------------

project_name:
  type: str
  help: |
    Cell name (kebab-case, lowercase, alphanumeric + hyphens).
    Used for the directory, README and the spec slug.
  validator: >-
    {% if not (project_name | regex_search('^[a-z][a-z0-9-]*$')) %}
    project_name must start with a lowercase letter and contain only
    lowercase letters, digits, and hyphens.
    {% endif %}

project_purpose:
  type: str
  help: |
    One line: what does this cell exist to do?
    Used in README, CLAUDE.md and the spec stub's Purpose.
  multiline: false

operator_github_handle:
  type: str
  help: |
    Your GitHub username (the @handle). Used in .github/CODEOWNERS so every
    PR auto-requests your review.
  default: JSBaxter

harness_ref:
  type: str
  help: |
    The JSBaxter/harness commit the workflow stubs pin to, rendered as
    `@<sha> # main`. The default is the harness main head recorded in the
    template; Renovate bumps it. A 40-hex commit SHA.
  default: 62804dc43a2dc1ed407d493a658c7328e528c1f6
  validator: >-
    {% if not (harness_ref | regex_search('^[0-9a-f]{40}$')) %}
    harness_ref must be a 40-character lowercase hex commit SHA of
    JSBaxter/harness.
    {% endif %}
