[project]
name = "queue"
version = "0.0.1"
description = "MCP task queue for cell agents. Tracks ideas, scoping, sessions, tokens, dependencies."
requires-python = ">=3.11"
dependencies = [
    "fastmcp>=2.0",
]

[dependency-groups]
dev = [
    "mypy>=1.20.2",
    "pytest>=8.0",
    "ruff>=0.15.12",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"

[tool.mypy]
python_version = "3.11"
warn_unused_configs = true

[tool.ruff]
target-version = "py311"

[tool.uv]
package = false
